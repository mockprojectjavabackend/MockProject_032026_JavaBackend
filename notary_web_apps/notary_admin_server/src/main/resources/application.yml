spring:
  application:
    name: notary_admin_server

  datasource:
    url: jdbc:mysql://localhost:3306/notary_db
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          json_format_mapper: jackson

server:
  port: 8080
  servlet:
    context-path: "/server"