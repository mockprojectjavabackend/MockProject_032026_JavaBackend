spring:
  application:
    name: notary_admin_server

  datasource:
    url: jdbc:mysql://localhost:3306/notary_db
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  web:
    resources:
      static-locations: file:///D:/Thuong/MockProject/upload/
server:
  port: 8080
  servlet:
    context-path: "/server"

thuong:
  upload-file:
    base-uri: D:/Thuong/MockProject/upload/
