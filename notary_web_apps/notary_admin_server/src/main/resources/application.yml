spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: notary_admin_server

  datasource:
    url: jdbc:mysql://localhost:3306/notary_db
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
  servlet:
    context-path: "/server"

app:
  upload:
    base-url: http://localhost:8080/server
    document:
      dir: uploads/documents
      max-size-bytes: 10485760        # 10 MB
